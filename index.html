<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Plantline Ops: a CRM and operations demo for a small manufacturer, built with agentic AI. Example data, nothing is saved.">
<title>Plantline Ops (public demo)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: left rail navigation + one working column. Dense, table-first, numbers in mono. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface2:#e9edf4; --line:#d6dce7; --fg:#141a26; --muted:#586379;
  --accent:#2549c9; --accent-fg:#ffffff; --accent-soft:#e1e8fb; --accent2:#9fb2ee;
  --good:#17744a; --good-soft:#dff3e8; --warn:#9a5b00; --warn-soft:#fbefd2; --bad:#bd2626; --bad-soft:#fbe0e0;
  --shadow:0 1px 2px rgba(20,26,38,.06),0 6px 20px rgba(20,26,38,.07);
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-head:'Archivo','IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1219; --surface:#161c26; --surface2:#1e2632; --line:#2a3443; --fg:#e5e9f1; --muted:#95a1b6;
  --accent:#86a2ff; --accent-fg:#0a1022; --accent-soft:#1c2a55; --accent2:#3c4f8f;
  --good:#52c78e; --good-soft:#15382a; --warn:#e8ac45; --warn-soft:#3a2d12; --bad:#ff8080; --bad-soft:#431c1c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1219; --surface:#161c26; --surface2:#1e2632; --line:#2a3443; --fg:#e5e9f1; --muted:#95a1b6;
  --accent:#86a2ff; --accent-fg:#0a1022; --accent-soft:#1c2a55; --accent2:#3c4f8f;
  --good:#52c78e; --good-soft:#15382a; --warn:#e8ac45; --warn-soft:#3a2d12; --bad:#ff8080; --bad-soft:#431c1c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:24px} h2{font-size:17px} h3{font-size:14px}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
#app{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;max-width:1360px;margin:0 auto;padding-block:16px 48px}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;flex-direction:column;gap:2px;padding:4px 10px 14px}
.brand b{font-family:var(--f-head);font-size:17px;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap}
nav a:hover{background:var(--surface2);color:var(--fg)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
nav .badge{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px}
nav .sep{height:1px;background:var(--line);margin:8px 10px}
main{min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-fg)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .v{font-family:var(--f-mono);font-size:22px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.cols2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.card>h2,.card>.hd{margin-bottom:10px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.card .tbl{border:0;border-radius:0}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
td.wrap{white-space:normal;min-width:200px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--surface);position:sticky;top:0;cursor:default}
th.sort{cursor:pointer} th.sort:hover{color:var(--accent)}
tbody tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:var(--surface2)}
td.r,th.r{text-align:right}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--surface2);color:var(--muted);text-transform:capitalize;letter-spacing:.02em}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tools input,.tools select,.f input,.f select,.f textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0}
.tools input[type=search]{min-width:min(100%,240px)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-weight:500}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:0}
.rec .t{font-weight:600} .rec .w{color:var(--muted);font-size:13px}
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface2);border-radius:8px;padding:8px;min-width:0;display:flex;flex-direction:column;gap:8px}
.col .ch{display:flex;justify-content:space-between;font-weight:600;padding:2px 4px}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.deal select{font-size:12px;padding:2px 4px;background:var(--surface);border:1px solid var(--line);border-radius:4px}
.dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 16px}
.dl dt{color:var(--muted)} .dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
.heat td.c{text-align:center;font-family:var(--f-mono);font-size:12px;padding:6px 8px}
.h0{background:var(--surface2)} .h1{background:var(--good-soft);color:var(--good)} .h2{background:var(--warn-soft);color:var(--warn)} .h3{background:var(--bad-soft);color:var(--bad);font-weight:600}
svg text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
svg .ax{stroke:var(--line);stroke-width:1} svg .capl{stroke:var(--fg);stroke-width:1.5;fill:none;stroke-dasharray:4 3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chartwrap{overflow-x:auto}
.chartwrap svg{min-width:520px;width:100%;height:auto;display:block}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.55);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal.on{display:flex}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);width:min(720px,100%);margin:auto;padding:18px 20px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin:14px 0}
.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.f label.full{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%;color:var(--fg);font-size:14px}
.f input[type=checkbox]{width:auto;align-self:flex-start}
.f .err{color:var(--bad)}
.lines{display:flex;flex-direction:column;gap:6px}
.lrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr)) auto;gap:6px;align-items:end}
.lrow label{font-size:11px}
.errs{color:var(--bad);font-size:13px;margin-top:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:60;display:none;max-width:90vw}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.skeleton{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
pre.json{background:var(--surface2);padding:10px;border-radius:6px;overflow:auto;font-family:var(--f-mono);font-size:12px;margin:0;white-space:pre-wrap}
@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);gap:8px}
  nav{position:sticky;top:env(safe-area-inset-top,0px);flex-direction:row;overflow-x:auto;background:var(--bg);z-index:5;padding:6px 0;margin:0 -2px;gap:2px}
  .brand,nav .sep{display:none}
  h1{font-size:20px}
}
[hidden]{display:none!important}
html{color-scheme:light dark}
</style>
</head><body>
<div id="app">
  <nav id="nav" aria-label="Sections"></nav>
  <main id="main"><div class="card"><div class="skeleton" style="width:40%"></div><br><div class="skeleton" style="width:90%"></div><br><div class="skeleton" style="width:70%"></div></div></main>
</div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>

<script>
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,9);
const DAY=864e5;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseD=s=>{if(!s)return null;const p=String(s).slice(0,10).split('-').map(Number);if(p.length<3||p.some(isNaN))return null;return new Date(p[0],p[1]-1,p[2])};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const monday=d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const todayD=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD=s=>{const d=s instanceof Date?s:parseD(s);return d?MON[d.getMonth()]+' '+d.getDate():'–'};
const fmtDY=s=>{const d=s instanceof Date?s:parseD(s);return d?MON[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear():'–'};
const N=(v,d=0)=>v==null||isNaN(v)?'–':Number(v).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(v,d=0)=>v==null||!isFinite(v)?'–':(v*100).toFixed(d)+'%';
let CUR_CODE='USD';
const M=(v,d=0)=>{if(v==null||isNaN(v))return '–';try{return new Intl.NumberFormat(undefined,{style:'currency',currency:CUR_CODE,minimumFractionDigits:d,maximumFractionDigits:d}).format(v)}catch(e){return N(v,d)}};
const clone=o=>JSON.parse(JSON.stringify(o));
const pill=(t,k='')=>`<span class="pill ${k}">${esc(t)}</span>`;
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)};

/* ============ data layer (db capability, in-memory fallback) ============ */
const COLLS=['accounts','contacts','activities','deals','products','materials','suppliers','pos','orders','workcenters','workorders','tasks','changelog','decisions','settings'];
const S={}; COLLS.forEach(c=>S[c]=[]);
const LOADED={}; let DB=null, PERSIST=true;
function makeMem(){const data={},subs={};const snap=n=>({docs:Object.entries(data[n]||{}).map(([id,v])=>({id,exists:true,data:()=>v}))});
  const emit=n=>(subs[n]||[]).forEach(f=>f(snap(n)));
  return {collection:n=>({onSnapshot(f){(subs[n]=subs[n]||[]).push(f);setTimeout(()=>f(snap(n)),0);return()=>{}},
    doc:id=>({set:async v=>{(data[n]=data[n]||{})[id]=v;emit(n)},update:async v=>{data[n]=data[n]||{};data[n][id]={...data[n][id],...v};emit(n)},delete:async()=>{if(data[n])delete data[n][id];emit(n)}})})}}
let renderQ=0;
function scheduleRender(){cancelAnimationFrame(renderQ);renderQ=requestAnimationFrame(render)}
async function initDb(){
  DB=makeMem();PERSIST=true;
  await seedDemo();
  COLLS.forEach(c=>DB.collection(c).onSnapshot(snap=>{
    S[c]=snap.docs.map(d=>({id:d.id,...d.data()}));LOADED[c]=true;scheduleRender();
  },err=>{LOADED[c]=true;scheduleRender()}));
}
const allLoaded=()=>COLLS.every(c=>LOADED[c]);
const get=(c,id)=>S[c].find(r=>r.id===id);
const nm=(c,id,k='name')=>{const r=get(c,id);return r?(r[k]||r.id):'–'};

/* ============ schema (drives forms, tables, dictionary) ============ */
const ORDER_FLOW=['Quote','Confirmed','In production','Shipped','Invoiced','Paid'];
const STAGES=['Lead','Sampling','Quote sent','Negotiation','Won','Lost'];
const PROB={Lead:.1,Sampling:.25,'Quote sent':.5,Negotiation:.7,Won:1,Lost:0};
const SCHEMA={
 accounts:{label:'Account',pfx:'a',defaults:()=>({status:'prospect',include:false,ramp_pct:[15,30,50,70,85,100]}),fields:[
  {k:'name',l:'Company',t:'text',req:1,src:'Entered by account owner'},
  {k:'status',l:'Status',t:'sel',o:['prospect','onboarding','active','paused','churned'],req:1,src:'Entered; moves with deals'},
  {k:'segment',l:'Segment',t:'text',list:1,src:'Entered'},
  {k:'industry',l:'Industry',t:'text',src:'Entered'},
  {k:'city',l:'City',t:'text',src:'Entered'},{k:'country',l:'Country',t:'text',src:'Entered'},
  {k:'owner',l:'Account owner',t:'text',src:'Entered'},
  {k:'product_id',l:'Primary product',t:'ref',c:'products',src:'Entered'},
  {k:'launch_date',l:'Launch / first order date',t:'date',src:'Entered'},
  {k:'launch_k_week',l:'Steady-state volume',t:'num',u:'k pcs / week',src:'Customer forecast, confirmed by sales'},
  {k:'ramp_pct',l:'Ramp % for weeks 1 to 6',t:'nums',u:'% of steady state',src:'Default by segment, overridable'},
  {k:'include',l:'Include in demand forecast',t:'bool',src:'Entered; prospects default off'},
  {k:'notes',l:'Notes',t:'area',src:'Entered'}]},
 contacts:{label:'Contact',pfx:'c',fields:[
  {k:'account_id',l:'Account',t:'ref',c:'accounts',req:1},{k:'name',l:'Name',t:'text',req:1},
  {k:'role',l:'Role',t:'text'},{k:'email',l:'Email',t:'text'},{k:'phone',l:'Phone',t:'text'}]},
 activities:{label:'Activity',pfx:'v',defaults:()=>({type:'note',date:iso(todayD())}),fields:[
  {k:'account_id',l:'Account',t:'ref',c:'accounts',req:1},{k:'type',l:'Type',t:'sel',o:['note','call','email','meeting','sample sent','site visit'],req:1},
  {k:'date',l:'Date',t:'date',req:1},{k:'text',l:'What happened',t:'area',req:1,full:1}]},
 deals:{label:'Deal',pfx:'d',defaults:()=>({stage:'Lead'}),fields:[
  {k:'title',l:'Deal',t:'text',req:1},{k:'account_id',l:'Account',t:'ref',c:'accounts',req:1},
  {k:'stage',l:'Stage',t:'sel',o:STAGES,req:1},{k:'product_id',l:'Product',t:'ref',c:'products'},
  {k:'qty_k_month',l:'Expected volume',t:'num',u:'k pcs / month'},{k:'value',l:'Expected revenue',t:'num',u:'currency / month'},
  {k:'close_date',l:'Expected close',t:'date'}]},
 products:{label:'Product',pfx:'p',defaults:()=>({scrap_pct:4,bom:[]}),fields:[
  {k:'sku',l:'SKU',t:'text',req:1},{k:'name',l:'Name',t:'text',req:1},{k:'category',l:'Category',t:'text',list:1},
  {k:'price_k',l:'Price',t:'num',u:'currency / 1,000 pcs',req:1},
  {k:'wc_id',l:'Made on',t:'ref',c:'workcenters'},{k:'rate_hr',l:'Machine rate',t:'num',u:'pcs / hour',req:1},
  {k:'scrap_pct',l:'Scrap',t:'num',u:'%'},
  {k:'bom',l:'Bill of materials (per 1,000 pcs)',t:'lines',full:1,sub:[{k:'material_id',l:'Material',t:'ref',c:'materials'},{k:'qty_per_k',l:'Qty per 1,000',t:'num'}]}]},
 materials:{label:'Material',pfx:'m',defaults:()=>({uom:'kg'}),fields:[
  {k:'name',l:'Material',t:'text',req:1},{k:'uom',l:'Unit of measure',t:'text',req:1},
  {k:'on_hand',l:'On hand',t:'num',req:1,src:'Counted; updated by work-order completion and receipts'},
  {k:'reorder_point',l:'Reorder point',t:'num'},{k:'cost',l:'Unit cost',t:'num',u:'currency / unit'},
  {k:'supplier_id',l:'Supplier',t:'ref',c:'suppliers'},{k:'lead_days',l:'Lead time',t:'num',u:'days'},{k:'min_order',l:'Minimum order',t:'num'}]},
 suppliers:{label:'Supplier',pfx:'s',fields:[
  {k:'name',l:'Supplier',t:'text',req:1},{k:'contact',l:'Contact',t:'text'},{k:'email',l:'Email',t:'text'},
  {k:'phone',l:'Phone',t:'text'},{k:'lead_days',l:'Typical lead time',t:'num',u:'days'},{k:'terms',l:'Payment terms',t:'text'}]},
 pos:{label:'Purchase order',pfx:'o',defaults:()=>({status:'Draft',lines:[]}),fields:[
  {k:'po_no',l:'PO number',t:'text'},{k:'supplier_id',l:'Supplier',t:'ref',c:'suppliers',req:1},
  {k:'status',l:'Status',t:'sel',o:['Draft','Sent','Received','Cancelled'],req:1},{k:'eta',l:'Expected arrival',t:'date'},
  {k:'lines',l:'Lines',t:'lines',full:1,sub:[{k:'material_id',l:'Material',t:'ref',c:'materials'},{k:'qty',l:'Quantity',t:'num'}]}]},
 orders:{label:'Order',pfx:'r',defaults:()=>({status:'Quote',order_date:iso(todayD()),lines:[]}),fields:[
  {k:'order_no',l:'Number',t:'text'},{k:'account_id',l:'Customer',t:'ref',c:'accounts',req:1},

/* ============ planning model ============ */
const SEG_RAMP={};
function fcK(a,ws,c){
  if(!a||!a.include||!a.launch_date||!(a.launch_k_week>0))return 0;
  const L=monday(parseD(a.launch_date));const w=Math.round((ws-L)/(7*DAY));if(w<0)return 0;
  const ramp=a.ramp_pct&&a.ramp_pct.length?a.ramp_pct:c.ramp;
  const r=w<ramp.length?(ramp[w]/100):1;
  const mid=addDays(ws,3);const seas=(a.season_override&&a.season_override.length===12?a.season_override:c.season)[mid.getMonth()]||1;
  return a.launch_k_week*r*seas;
}
const weekOf=s=>{const d=parseD(s);return d?iso(monday(d)):null};
const OPEN_ORD=o=>o.status==='Confirmed'||o.status==='In production';
const DONE_ORD=o=>['Shipped','Invoiced','Paid'].includes(o.status);
function prodHours(p,k){if(!p||!p.rate_hr)return 0;return k*1000*(1+(p.scrap_pct||0)/100)/p.rate_hr}
function planWeeks(n,startOffset=0){const w0=addDays(monday(todayD()),7*startOffset);return Array.from({length:n},(_,i)=>addDays(w0,7*i))}
/* demand per week: booked (open orders) + unbooked (forecast minus booked per account) */
let _plan=null;
function plan(){
  if(_plan)return _plan;
  const c=cfg();
  const weeks=planWeeks(c.horizon);const out=weeks.map(ws=>({ws,k:iso(ws),prod:{},wc:{}}));
  const add=(row,pid,kind,k)=>{const p=get('products',pid);row.prod[pid]=row.prod[pid]||{booked:0,unbooked:0};row.prod[pid][kind]+=k;
    const wcid=p&&p.wc_id||'_none';row.wc[wcid]=row.wc[wcid]||{booked:0,unbooked:0};row.wc[wcid][kind]+=prodHours(p,k)};
  out.forEach(row=>{
    const bookedAcc={};
    S.orders.filter(o=>OPEN_ORD(o)&&weekOf(o.due_date)===row.k).forEach(o=>{(o.lines||[]).forEach(l=>{add(row,l.product_id,'booked',+l.qty_k||0);bookedAcc[o.account_id]=(bookedAcc[o.account_id]||0)+(+l.qty_k||0)})});
    S.accounts.forEach(a=>{const f=fcK(a,row.ws,c);const un=Math.max(0,f-(bookedAcc[a.id]||0));if(un>0&&a.product_id)add(row,a.product_id,'unbooked',un)});
  });
  _plan=out;return out;
}
function wcCap(w){return (w.hours_week||0)*((w.oee==null?70:w.oee)/100)}
function util(row,wcid){const w=get('workcenters',wcid);if(!w)return null;const x=row.wc[wcid]||{booked:0,unbooked:0};const cap=wcCap(w);return cap?{booked:x.booked,unbooked:x.unbooked,cap,u:(x.booked+x.unbooked)/cap}:null}
function matConsumption(weeks=4){ // per material, units per week average over next N weeks
  const rows=plan().slice(0,weeks);const out={};
  rows.forEach(r=>Object.entries(r.prod).forEach(([pid,x])=>{const p=get('products',pid);(p&&p.bom||[]).forEach(b=>{out[b.material_id]=(out[b.material_id]||0)+(x.booked+x.unbooked)*(+b.qty_per_k||0)})}));
  Object.keys(out).forEach(k=>out[k]/=weeks);return out;
}
function onOrder(mid){let s=0;S.pos.filter(p=>p.status==='Sent').forEach(p=>(p.lines||[]).forEach(l=>{if(l.material_id===mid)s+=+l.qty||0}));return s}
function matStatus(m){
  const wk=matConsumption(4)[m.id]||0;const cover=wk>0?(m.on_hand||0)/(wk/7):null;const oo=onOrder(m.id);
  const lead=m.lead_days||0;
  const need=(m.on_hand||0)<(m.reorder_point||0)||(cover!=null&&cover<lead+3);
  const covered=need&&((m.on_hand||0)+oo)>=Math.max(m.reorder_point||0,wk*(lead+3)/7);
  return {wk,cover,oo,need:need&&!covered,flag:need};
}
function productCost(p){let s=cfg().conv;(p.bom||[]).forEach(b=>{const m=get('materials',b.material_id);if(m)s+=(+b.qty_per_k||0)*(m.cost||0)});return s}
function accuracy(){
  const c=cfg();const weeks=planWeeks(6,-6);const per={};
  weeks.forEach(ws=>{const k=iso(ws);
    S.accounts.forEach(a=>{per[a.id]=per[a.id]||{a:0,f:0,ae:0};const f=fcK(a,ws,c);
      let act=0;S.orders.filter(o=>o.account_id===a.id&&DONE_ORD(o)&&weekOf(o.due_date)===k).forEach(o=>(o.lines||[]).forEach(l=>act+=+l.qty_k||0));
      if(a.include||act>0){per[a.id].a+=act;per[a.id].f+=f;per[a.id].ae+=Math.abs(act-f)}})});
  const seg={};let A=0,F=0,AE=0;
  Object.entries(per).forEach(([id,x])=>{if(!x.a&&!x.f)return;const a=get('accounts',id);const s=(a&&a.segment)||'Unassigned';seg[s]=seg[s]||{a:0,f:0,ae:0};seg[s].a+=x.a;seg[s].f+=x.f;seg[s].ae+=x.ae;A+=x.a;F+=x.f;AE+=x.ae});
  const series=weeks.map(ws=>{const k=iso(ws);let act=0,f=0;S.orders.filter(o=>DONE_ORD(o)&&weekOf(o.due_date)===k).forEach(o=>(o.lines||[]).forEach(l=>act+=+l.qty_k||0));S.accounts.forEach(a=>f+=fcK(a,ws,c));return {ws,act,f}});
  return {per,seg,A,F,wape:A?AE/A:null,bias:A?(F-A)/A:null,series};
}

function recs(){
  const c=cfg(),out=[],decided=new Set(S.decisions.map(d=>d.key));const wk=iso(monday(todayD()));
  S.materials.forEach(m=>{const st=matStatus(m);if(!st.need)return;const key=`po-${m.id}-${wk}`;if(decided.has(key))return;
    const qty=Math.max(m.min_order||0,Math.ceil(Math.max(0,st.wk*4-(m.on_hand||0)-st.oo)/50)*50);
    out.push({key,sev:'bad',title:`Buy ${m.name}`,why:`${N(m.on_hand)} ${m.uom} on hand covers ${st.cover==null?'unknown':N(st.cover,0)} days of planned use; supplier lead time is ${m.lead_days||'?'} days. Draft ${N(qty)} ${m.uom} from ${nm('suppliers',m.supplier_id)} (about ${M(qty*(m.cost||0))}).`,
      act:'Create draft PO',run:async()=>{await save('pos',{po_no:nextNo('pos','po_no','PO-',1001),supplier_id:m.supplier_id||'',status:'Draft',eta:iso(addDays(todayD(),m.lead_days||7)),lines:[{material_id:m.id,qty}]});}});});
  const rows=plan();
  S.workcenters.forEach(w=>{const over=rows.slice(0,8).filter(r=>{const u=util(r,w.id);return u&&u.u>1.0});if(!over.length)return;
    const r0=over[0],key=`cap-${w.id}-${r0.k}`;if(decided.has(key))return;
    const peak=Math.max(...over.map(r=>util(r,w.id).u));const hrs=over.reduce((s,r)=>{const u=util(r,w.id);return s+(u.booked+u.unbooked-u.cap)},0);
    out.push({key,sev:'warn',title:`${w.name} over capacity from ${fmtD(r0.ws)}`,why:`${over.length} week${over.length>1?'s':''} above 100%, peaking at ${pct(peak)}; ${N(hrs,0)} machine hours too many in total. Options: add a weekend shift, move due dates, or subcontract.`,
      act:'Create planning task',run:async()=>{await save('tasks',{title:`Resolve overload on ${w.name} from ${fmtD(r0.ws)} (${N(hrs,0)} h over across ${over.length} wk)`,due:iso(todayD()),owner:'',priority:'high',status:'open',related:w.name})}});});
  S.orders.filter(o=>o.status==='Quote').forEach(o=>{const age=Math.floor((todayD()-parseD(o.order_date))/DAY);if(age<c.quote_days)return;const key=`quote-${o.id}`;if(decided.has(key))return;
    out.push({key,sev:'info',title:`Follow up quote ${o.order_no||''} for ${nm('accounts',o.account_id)}`,why:`Quote is ${age} days old and still open (${M(orderTotal(o))}).`,act:'Create follow-up task',run:async()=>{await save('tasks',{title:`Follow up on quote ${o.order_no} with ${nm('accounts',o.account_id)}`,due:iso(addDays(todayD(),2)),priority:'normal',status:'open',related:o.order_no})}});});
  S.accounts.filter(a=>a.status==='active').forEach(a=>{const last=S.activities.filter(v=>v.account_id===a.id).map(v=>v.date).sort().pop();const age=last?Math.floor((todayD()-parseD(last))/DAY):999;if(age<c.dormant_days)return;const key=`dormant-${a.id}-${wk}`;if(decided.has(key))return;
    out.push({key,sev:'info',title:`${a.name} has gone quiet`,why:last?`Last logged contact was ${age} days ago.`:'No contact logged yet.',act:'Create check-in task',run:async()=>{await save('tasks',{title:`Check in with ${a.name}`,due:iso(addDays(todayD(),3)),priority:'normal',status:'open',related:a.name})}});});
  return out;
}

/* ============ charts ============ */
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function capChart(rows,wcid){ // stacked hours vs capacity for work center (or all)
  const data=rows.map(r=>{let b=0,u=0,cap=0;S.workcenters.forEach(w=>{if(wcid&&wcid!==w.id)return;const x=util(r,w.id);if(x){b+=x.booked;u+=x.unbooked;cap+=x.cap}});return {r,b,u,cap}});
  const W=720,H=240,L=44,R=10,T=14,B=30;const mx=niceMax(Math.max(...data.map(d=>Math.max(d.b+d.u,d.cap)),1)*1.08);
  const bw=(W-L-R)/data.length;const y=v=>T+(H-T-B)*(1-v/mx);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hours required against capacity by week">`;
  for(let i=0;i<=4;i++){const v=mx*i/4;s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${N(v)}</text>`}
  data.forEach((d,i)=>{const x=L+i*bw+bw*.18,w=bw*.64;const over=(d.b+d.u)>d.cap&&d.cap>0;
    s+=`<g><title>Week of ${fmtD(d.r.ws)}: ${N(d.b,0)} h booked + ${N(d.u,0)} h forecast vs ${N(d.cap,0)} h capacity (${d.cap?pct((d.b+d.u)/d.cap):'–'})</title>`;
    s+=`<rect x="${x}" y="${y(d.b)}" width="${w}" height="${y(0)-y(d.b)}" fill="var(--accent)" rx="1"/>`;
    s+=`<rect x="${x}" y="${y(d.b+d.u)}" width="${w}" height="${y(d.b)-y(d.b+d.u)}" fill="var(--accent2)" rx="1"/>`;
    if(over)s+=`<text x="${x+w/2}" y="${y(d.b+d.u)-4}" text-anchor="middle" style="fill:var(--bad);font-weight:600">${pct((d.b+d.u)/d.cap)}</text>`;
    s+=`<text x="${x+w/2}" y="${H-B+13}" text-anchor="middle">${fmtD(d.r.ws)}</text></g>`;});
  let pth='';data.forEach((d,i)=>{const x1=L+i*bw,x2=x1+bw;pth+=(i?' L':'M')+x1+' '+y(d.cap)+' L'+x2+' '+y(d.cap)});
  s+=`<path class="capl" d="${pth}"/></svg>`;
  return `<div class="chartwrap">${s}</div><div class="legend"><span><i style="background:var(--accent)"></i>Booked orders</span><span><i style="background:var(--accent2)"></i>Forecast not yet ordered</span><span><i style="border-top:2px dashed var(--fg);height:0;border-radius:0;width:14px;vertical-align:3px"></i>Usable capacity (hours per week)</span></div>`;
}
function lineChart(acc,fut){
  const pts=[...acc.series.map(s=>({ws:s.ws,a:s.act,f:s.f})),...fut];const W=720,H=230,L=44,R=10,T=14,B=30;
  const mx=niceMax(Math.max(...pts.map(p=>Math.max(p.a||0,p.f||0)),1)*1.08);const bw=(W-L-R)/pts.length;const x=i=>L+i*bw+bw/2,y=v=>T+(H-T-B)*(1-v/mx);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Forecast against actual shipped volume by week">`;
  for(let i=0;i<=4;i++){const v=mx*i/4;s+=`<line class="ax" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${N(v)}</text>`}
  const ti=acc.series.length;s+=`<line x1="${L+ti*bw}" x2="${L+ti*bw}" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="2 3"/><text x="${L+ti*bw+4}" y="${T+8}">today</text>`;
  const path=(key,from,to)=>{let p='',first=true;for(let i=from;i<to;i++){if(pts[i][key]==null)continue;p+=(first?'M':' L')+x(i)+' '+y(pts[i][key]);first=false}return p};
  s+=`<path d="${path('f',0,pts.length)}" fill="none" stroke="var(--accent2)" stroke-width="2.5"/>`;
  s+=`<path d="${path('a',0,ti)}" fill="none" stroke="var(--fg)" stroke-width="2"/>`;
  pts.forEach((p,i)=>{if(p.a!=null&&i<ti)s+=`<circle cx="${x(i)}" cy="${y(p.a)}" r="3" fill="var(--fg)"><title>${fmtD(p.ws)} actual ${N(p.a,0)}k, forecast ${N(p.f,0)}k</title></circle>`;if(i%2===0||i===pts.length-1)s+=`<text x="${x(i)}" y="${H-B+13}" text-anchor="middle">${fmtD(p.ws)}</text>`});
  s+='</svg>';
  return `<div class="chartwrap">${s}</div><div class="legend"><span><i style="background:var(--fg)"></i>Actual shipped (k pcs)</span><span><i style="background:var(--accent2)"></i>Forecast (k pcs)</span></div>`;
}

    const prompt=`You are helping a paper-products manufacturer (cups, bowls, plates) plan demand for one B2B customer.\nCustomer: ${a.name}\nSegment: ${a.segment||'unknown'}\nIndustry: ${a.industry||'unknown'}\nLocation: ${[a.city,a.country].filter(Boolean).join(', ')||'unknown'}\n\nRules: use only general public knowledge about this kind of business. Do not guess. If you do not know something, use "unknown" (or null for seasonality). Never invent sources; leave sources empty if you cannot name a real one.\nReturn ONLY JSON in exactly this shape:\n{"seasonality":[12 numbers for Jan..Dec where 1.0 is an average month, or null],"peak_months":["Jan",...],"growth_signal":"up|flat|down|unknown","risks":["short strings"],"confidence":"low|medium|high","sources":[{"title":"","url":""}]}`;
    const res=await sample.json(prompt,{modelTier:'quick',cache:false});
    const out={seasonality:Array.isArray(res.seasonality)&&res.seasonality.length===12&&res.seasonality.every(v=>typeof v==='number'&&v>.3&&v<2.5)?res.seasonality:null,peak_months:Array.isArray(res.peak_months)?res.peak_months.slice(0,6).map(String):[],growth_signal:['up','flat','down'].includes(res.growth_signal)?res.growth_signal:'unknown',risks:Array.isArray(res.risks)?res.risks.slice(0,6).map(s=>String(s).slice(0,160)):[],confidence:['low','medium','high'].includes(res.confidence)?res.confidence:'low',sources:Array.isArray(res.sources)?res.sources.filter(s=>s&&s.url&&/^https?:\/\//.test(s.url)).slice(0,5).map(s=>({title:String(s.title||'').slice(0,120),url:String(s.url).slice(0,300)})):[]};
    RS[id]={res:out};
  }catch(e){RS[id]={err:(e&&e.message)||'Research failed. Try again.'}}
  render();
}

async function saveSettings(e){
  e.preventDefault();const f=new FormData(e.target);const msg=$('#setmsg');
  const nums=(s,n)=>{const a=String(s).split(/[\s,]+/).filter(Boolean).map(Number);return a.length===n&&a.every(v=>!isNaN(v))?a:null};
  const season=nums(f.get('season'),12),ramp=String(f.get('ramp')).split(/[\s,]+/).filter(Boolean).map(Number);
  if(!season){msg.textContent='Seasonal index needs 12 numbers.';return}
  if(!ramp.length||ramp.some(isNaN)){msg.textContent='Ramp needs numbers like 15, 30, 50, 70, 85, 100.';return}
  const cur=String(f.get('cur')).trim().toUpperCase();if(!/^[A-Z]{3}$/.test(cur)){msg.textContent='Currency is a 3-letter code such as USD or EUR.';return}
  const old=S.settings.find(x=>x.id==='main');
  await save('settings',{...(old||{}),company:String(f.get('company')).trim()||'My Plant',cur,conv:+f.get('conv')||0,quote_days:+f.get('quote_days')||7,dormant_days:+f.get('dormant_days')||30,season,ramp},old,'main');
  _plan=null;toast('Settings saved');
}

  if(f.t==='nums')return `<label class="${f.full?'full':''}">${esc(f.l)}${f.u?` <span class="muted">(${esc(f.u)})</span>`:''}<input name="${n}" value="${esc((val||[]).join(', '))}"></label>`;
  if(f.t==='sel')return `<label>${esc(f.l)}${f.req?' *':''}<select name="${n}">${f.o.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
  if(f.t==='ref')return `<label>${esc(f.l)}${f.req?' *':''}<select name="${n}" ${f.auto?`data-auto="${f.auto}"`:''}>${refOpts(f,val)}</select></label>`;
  if(f.t==='lines')return `<div class="full" style="grid-column:1/-1"><div class="muted small" style="margin-bottom:4px;font-weight:500">${esc(f.l)}</div><div class="lines" data-lines="${f.k}">${(val||[]).map(r=>lineRow(f,r)).join('')}</div><button type="button" class="btn sm" style="margin-top:6px" data-act="addrow" data-k="${f.k}">+ Add line</button><div class="small muted" id="tot-${f.k}"></div></div>`;

function lineRow(f,r={}){return `<div class="lrow">${f.sub.map(s=>`<label>${esc(s.l)}${s.t==='ref'?`<select data-sk="${s.k}" ${s.auto?`data-auto="${s.auto}"`:''}>${refOpts(s,r[s.k])}</select>`:`<input data-sk="${s.k}" inputmode="decimal" value="${r[s.k]==null?'':esc(r[s.k])}">`}</label>`).join('')}<button type="button" class="btn sm" data-act="delrow" aria-label="Remove line">✕</button></div>`}
function openForm(coll,rec,pre={}){

  if(isNew&&coll==='pos'&&!rec.po_no)rec.po_no=nextNo('pos','po_no','PO-',1001);

   <div class="f">${sc.fields.map(f=>fieldHTML(f,rec[f.k])).join('')}</div>
   ${Object.entries(lists).map(([k,v])=>`<datalist id="dl-${k}">${v.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`).join('')}

function readLines(f,form){return [...form.querySelectorAll(`[data-lines="${f.k}"] .lrow`)].map(row=>{const o={};f.sub.forEach(s=>{const el=row.querySelector(`[data-sk="${s.k}"]`);let v=el.value.trim();o[s.k]=s.t==='ref'?v:(v===''?null:Number(v))});return o}).filter(o=>f.sub.some(s=>o[s.k]!==''&&o[s.k]!==null))}
function updateTotals(){
  if(!FORM)return;const form=$('#form');if(!form)return;
  if(FORM.coll==='orders'){const f=SCHEMA.orders.fields.find(x=>x.k==='lines');const ls=readLines(f,form);const el=$('#tot-lines');if(el)el.textContent='Order value '+M(ls.reduce((s,l)=>s+(+l.qty_k||0)*(+l.price_k||0),0))}
  if(FORM.coll==='products'){const f=SCHEMA.products.fields.find(x=>x.k==='bom');const ls=readLines(f,form);let cost=cfg().conv;ls.forEach(l=>{const m=get('materials',l.material_id);if(m)cost+=(+l.qty_per_k||0)*(m.cost||0)});const price=+form.elements.price_k.value;const el=$('#tot-bom');if(el)el.textContent=`Unit cost ${M(cost,2)} per 1,000${price?` · margin ${pct((price-cost)/price)}`:''}`}

async function submitForm(e){
  e.preventDefault();const {coll,rec,isNew}=FORM;const sc=SCHEMA[coll];const form=e.target;const out={};const errs=[];
  sc.fields.forEach(f=>{
    const el=form.elements[f.k];let v;
    if(f.t==='lines'){v=readLines(f,form)}
    else if(f.t==='bool'){v=!!el.checked}
    else if(f.t==='num'){const s=el.value.trim().replace(/,/g,'');if(s==='')v=null;else{v=Number(s);if(isNaN(v)){errs.push(`${f.l} must be a number.`);v=null}}}
    else if(f.t==='nums'){const parts=el.value.split(/[\s,]+/).filter(Boolean);v=parts.map(Number);if(v.some(isNaN)){errs.push(`${f.l} must be numbers separated by commas.`);v=[]}}
    else v=el.value.trim();
    if(f.req&&(v===''||v==null||(Array.isArray(v)&&!v.length)))errs.push(`${f.l} is required.`);
    out[f.k]=v;
  });
  if(coll==='orders'){if(!out.lines.length)errs.push('Add at least one line.');out.lines.forEach((l,i)=>{if(!l.product_id)errs.push(`Line ${i+1} needs a product.`);if(!(l.qty_k>0))errs.push(`Line ${i+1} needs a quantity above zero.`)})}
  if(coll==='products'){out.bom=out.bom.filter(b=>b.material_id)}
  if(coll==='pos'){out.lines=out.lines.filter(b=>b.material_id)}
  if(coll==='accounts'&&out.include&&!(out.launch_k_week>0&&out.launch_date))errs.push('To include an account in the forecast, give it a launch date and a steady-state volume.');
  if(errs.length){$('#ferr').innerHTML=errs.map(esc).join('<br>');return}
  const btn=form.querySelector('button[type=submit]');btn.disabled=true;
  try{
    const nu={...(isNew?{}:rec),...out};
    if(coll==='deals'&&out.stage==='Won'){const a=get('accounts',out.account_id);if(a&&a.status==='prospect')await patch('accounts',a.id,{status:'onboarding'})}
    await save(coll,nu,isNew?null:get(coll,rec.id),isNew?undefined:rec.id);
    _plan=null;closeModal();toast('Saved');
  }catch(err){btn.disabled=false;$('#ferr').textContent='Could not save: '+((err&&err.message)||'try again')}
}

/* ============ CSV ============ */
function csvEsc(v){v=v==null?'':Array.isArray(v)?JSON.stringify(v):String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()!==''))}
async function exportCsv(coll){
  const keys=[...new Set(S[coll].flatMap(r=>Object.keys(r)))].filter(k=>k!=='research'&&k!=='id');
  const csv=[['id',...keys].map(csvEsc).join(','),...S[coll].map(r=>['id',...keys].map(k=>csvEsc(k==='id'?r.id:r[k])).join(','))].join('\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');
  a.href=url;a.download=`${coll}-${iso(todayD())}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Export ready');
}
let CSVROWS=[];
async function onCsv(e){
  const file=e.target.files[0];if(!file)return;const t=await file.text();const rows=parseCSV(t);const box=$('#csvprev');
  if(rows.length<2){box.innerHTML='<div class="errs">The file has no data rows. Nothing was imported.</div>';return}
  const head=rows[0].map(h=>h.trim().toLowerCase());const ix=k=>head.indexOf(k);
  if(ix('name')<0){box.innerHTML='<div class="errs">A “name” column is required in the header row.</div>';return}
  const seen=new Set(S.accounts.map(a=>a.name.toLowerCase()));CSVROWS=[];const bad=[];
  rows.slice(1).forEach((r,i)=>{const g=k=>ix(k)>=0?String(r[ix(k)]||'').trim():'';const name=g('name');const errs=[];
    if(!name)errs.push('name is empty');else if(seen.has(name.toLowerCase()))errs.push('already exists');
    const status=(g('status')||'prospect').toLowerCase();if(!SCHEMA.accounts.fields[1].o.includes(status))errs.push('status “'+status+'” not allowed');
    const ld=g('launch_date');if(ld&&!parseD(ld))errs.push('launch_date must be YYYY-MM-DD');
    const vol=g('launch_k_week');if(vol&&isNaN(Number(vol)))errs.push('launch_k_week must be a number');
    const sku=g('product_sku');const prod=sku?S.products.find(p=>p.sku.toLowerCase()===sku.toLowerCase()):null;if(sku&&!prod)errs.push('unknown product_sku');
    if(errs.length)bad.push({line:i+2,name,errs});else{seen.add(name.toLowerCase());CSVROWS.push({name,status,segment:g('segment'),industry:g('industry'),city:g('city'),country:g('country'),owner:g('owner'),launch_date:ld||'',launch_k_week:vol?Number(vol):null,product_id:prod?prod.id:'',include:false,ramp_pct:cfg().ramp})}});
  box.innerHTML=`<p>${CSVROWS.length} row(s) valid, ${bad.length} rejected.</p>${bad.length?`<div class="errs">${bad.slice(0,10).map(b=>`Line ${b.line} ${esc(b.name)}: ${esc(b.errs.join('; '))}`).join('<br>')}</div>`:''}${CSVROWS.length?`<button class="btn pri" data-act="csv-go" style="margin-top:8px">Import ${CSVROWS.length} account(s)</button>`:'<div class="errs">Nothing valid to import, so nothing was changed.</div>'}`;
}

function shiftDates(v,days){
  if(typeof v==='string'&&/^\d{4}-\d\d-\d\d$/.test(v)){const d=parseD(v);return iso(addDays(d,days))}
  if(Array.isArray(v))return v.map(x=>shiftDates(x,days));
  if(v&&typeof v==='object'){const o={};for(const k in v)o[k]=shiftDates(v[k],days);return o}
  return v;
}
